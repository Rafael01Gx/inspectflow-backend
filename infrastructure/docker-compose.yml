services:

  # ============================================================
  # TRAEFIK — Reverse Proxy / TLS Termination
  # ============================================================

  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    user: "0:1001"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--log.level=WARNING"
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=inspectflow-network"
      - "--providers.docker.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.traefik.address=:8080"
      - "--ping=true"
      - "--ping.entrypoint=traefik"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - traefik-certificates:/letsencrypt
    networks:
      - inspectflow-network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=traefik"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.rflgx.com.br`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=web"

  # ============================================================
  # FRONTEND
  # ============================================================

  inspectflow-web:
    image: xrafaelgx/inspectflow-web:latest
    container_name: inspectflow-web
    restart: unless-stopped
    environment:
      - API_URL=/api
      - API_IA_URL=/api/ia
      - WS_URL=/api/ws
      - PORT=4000
    networks:
      - inspectflow-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`inspectflow.rflgx.com.br`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=4000"
      - "traefik.http.middlewares.frontend-compress.compress=true"
      - "traefik.http.routers.frontend.middlewares=frontend-compress"

  # ============================================================
  # API
  # ============================================================

  inspectflow-api:
    image: xrafaelgx/inspectflow-api:development
    container_name: inspectflow-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      - inspectflow-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`inspectflow.rflgx.com.br`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.api-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.api.middlewares=api-stripprefix"
      - "traefik.http.services.api.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.api.loadbalancer.sticky.cookie.name=api_sticky"

  # ============================================================
  # BANCOS DE DADOS
  # ============================================================

  postgres:
    image: postgres:18-alpine
    container_name: inspectflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       inspectflow
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - inspectflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8
    container_name: inspectflow-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE:      inspectflow
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - inspectflow-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/inspectflow --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.2-alpine3.22
    container_name: inspectflow-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - inspectflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:3.2
    container_name: inspectflow-redis-insight
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    networks:
      - inspectflow-network
    depends_on:
      redis:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inspectflow-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - inspectflow-network
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`inspectflow-psql.rflgx.com.br`)"
      - "traefik.http.routers.pgadmin.entrypoints=web"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

  mongo-express:
    image: mongo-express:latest
    container_name: inspectflow-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL:           mongodb://admin:${MONGO_ROOT_PASSWORD}@inspectflow-mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME:    admin
      ME_CONFIG_BASICAUTH_PASSWORD:    ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - inspectflow-network
    depends_on:
      mongodb:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_SERVER_URL:    http://minio.rflgx.com.br
    volumes:
      - minio_data:/data
    networks:
      - inspectflow-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=inspectflow-network"
      - "traefik.http.routers.minio.rule=Host(`minio.rflgx.com.br`)"
      - "traefik.http.routers.minio.entrypoints=web"
      - "traefik.http.routers.minio.priority=100"
      - "traefik.http.routers.minio.service=minio-svc"
      - "traefik.http.services.minio-svc.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console.rule=Host(`minio-console.rflgx.com.br`)"
      - "traefik.http.routers.minio-console.entrypoints=web"
      - "traefik.http.routers.minio-console.priority=100"
      - "traefik.http.routers.minio-console.service=minio-console-svc"
      - "traefik.http.services.minio-console-svc.loadbalancer.server.port=9001"

  # ============================================================
  # OBSERVABILIDADE
  # ============================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: inspectflow-otel-collector
    restart: unless-stopped
    command:
      - "--config=/etc/otelcol/config.yml"
    volumes:
      - ./observability/otel-collector/config.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - inspectflow-network
    depends_on:
      loki:
        condition: service_started
      jaeger:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: inspectflow-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - inspectflow-network
    depends_on:
      inspectflow-api:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.rflgx.com.br`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: inspectflow-jaeger
    restart: unless-stopped
    environment:
      SPAN_STORAGE_TYPE:       badger
      BADGER_EPHEMERAL:        "false"
      BADGER_DIRECTORY_VALUE:  /badger/data
      BADGER_DIRECTORY_KEY:    /badger/key
      COLLECTOR_OTLP_ENABLED:  "true"
      MEMORY_MAX_TRACES:       ""
    ports:
      - "16686:16686"
    volumes:
      - jaeger_data:/badger
    networks:
      - inspectflow-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jaeger.rule=Host(`jaeger.rflgx.com.br`)"
      - "traefik.http.routers.jaeger.entrypoints=web"
      - "traefik.http.services.jaeger.loadbalancer.server.port=16686"

  loki:
    image: grafana/loki:latest
    container_name: inspectflow-loki
    restart: unless-stopped
    user: "10001:10001"
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - inspectflow-network

  promtail:
    image: grafana/promtail:latest
    container_name: inspectflow-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./logs:/logs:ro
    networks:
      - inspectflow-network
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    container_name: inspectflow-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:             admin
      GF_SECURITY_ADMIN_PASSWORD:         ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:             "false"
      GF_PATHS_PROVISIONING:              /etc/grafana/provisioning
      GF_FEATURE_TOGGLES_ENABLE:          traceqlEditor
      GF_ANALYTICS_REPORTING_ENABLED:     "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES:     "false"
      GF_SERVER_ROOT_URL:                 "https://grafana.rflgx.com.br"
      GF_SECURITY_COOKIE_SECURE:          "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
    ports:
      - "3010:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - inspectflow-network
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
      otel-collector:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.rflgx.com.br`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

# ============================================================
# VOLUMES
# ============================================================

volumes:
  postgres_data:
    driver: local
    name: inspectflow_postgres_data

  mongodb_data:
    driver: local
    name: inspectflow_mongodb_data

  mongodb_config:
    driver: local
    name: inspectflow_mongodb_config

  pgadmin_data:
    driver: local
    name: inspectflow_pgadmin_data

  minio_data:
    driver: local
    name: inspectflow_minio_data

  traefik-certificates:
    driver: local
    name: inspectflow_traefik_certificates

  prometheus_data:
    driver: local
    name: inspectflow_prometheus_data

  loki_data:
    driver: local
    name: inspectflow_loki_data

  grafana_data:
    driver: local
    name: inspectflow_grafana_data

  redis_data:
    driver: local
    name: inspectflow_redis_data

  jaeger_data:
    driver: local
    name: inspectflow_jaeger_data

# ============================================================
# NETWORKS
# ============================================================

networks:
  inspectflow-network:
    driver: bridge
    name: inspectflow-network
