management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
          - httptrace
          - loggers
          - env
          - threaddump
          - scheduledtasks
      base-path: /actuator

  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState, ping
        readiness:
          include: readinessState, db, mongo, redis
    info:
      enabled: true

  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name:inspectflow}
      environment: ${ENVIRONMENT:local}
      version: ${BUILD_VERSION:0.0.1-SNAPSHOT}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.data.repository.invocations: true
        jdbc.query: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        jdbc.query: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s

    enable:
      jvm: true                         # Memória, GC, threads
      process: true                     # CPU, uptime
      system: true                      # Disk, load
      tomcat: true                      # Threads, conexões do Tomcat
      logback: true                     # Contagem de logs por nível
      hikari: true                      # Pool de conexões PostgreSQL
      mongo: true                       # Métricas do driver MongoDB
      redis: true                       # Métricas do Lettuce/Redis
      executor: true                    # Thread pools (@Async)

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

    propagation:
      type: W3C

    baggage:
      remote-fields:
        - userId
        - correlationId

  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

      compression: gzip
      timeout: 10s
      headers:

datasource:
  micrometer:
    enabled: true

    includes:
      - connection-id    # ID da conexão para correlacionar com pool
      - query            # SQL executado (cuidado com dados sensíveis em prod)
      - query-parameters # Parâmetros da query (DESABILITAR em produção!)
      - row-count        # Número de linhas retornadas
      - result-set       # Dados do ResultSet
      - statement        # Statement info

    # Controle de dados sensíveis por ambiente
    # Em produção, sobrescreva com:
    # includes: [connection-id, query, row-count]
    # (remova query-parameters por LGPD/segurança)

    observation:
      enabled: true


spring:
  application:
    name: inspectflow

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/inspectflow}

  jpa:
    properties:
      hibernate:
        generate_statistics: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 100

  redis:
    lettuce:
      pool:
        enabled: true

  task:
    execution:
      thread-name-prefix: inspectflow-async-
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
        keep-alive: 60s


    scheduling:
      thread-name-prefix: inspectflow-scheduler-
      pool:
        size: 4

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [${spring.application.name},%X{traceId:-},%X{spanId:-}] %cyan(%logger{36}) - %msg%n"

  level:
    root: INFO
    io.micrometer: INFO
    io.opentelemetry: INFO
    io.opentelemetry.exporter: WARN
    net.ttddyy.observation: INFO

    br.com.inspectflow: INFO

    # Hibernate SQL (desenvolvimento)
    org.hibernate.SQL: DEBUG            # Mostra SQL gerado
    org.hibernate.type.descriptor.sql: TRACE  # Mostra valores dos parâmetros
