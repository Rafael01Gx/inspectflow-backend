apiVersion: 1

datasources:

  # ============================================================================
  # PROMETHEUS — Métricas
  # ============================================================================
  - name:      Prometheus
    type:      prometheus
    uid:       prometheus
    access:    proxy
    url:       http://prometheus:9090
    isDefault: true
    editable:  false
    jsonData:
      httpMethod:       POST
      timeInterval:     15s
      exemplarTraceIdDestinations:
        # Correlação Prometheus Exemplar → Jaeger
        # Ao clicar em um pico de latência no Grafana, abre o trace no Jaeger
        - name:               traceID
          datasourceUid:      jaeger
          urlDisplayLabel:    "Ver no Jaeger"

  # ============================================================================
  # JAEGER — Distributed Tracing
  # ============================================================================
  - name:    Jaeger
    type:    jaeger
    uid:     jaeger
    access:  proxy
    url:     http://jaeger:16686
    editable: false
    jsonData:
      tracesToLogsV2:
        # Correlação Jaeger → Loki
        # Ao visualizar um trace, mostra os logs correlacionados pelo traceId
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift:   "1m"
        tags:
          - key:   traceId
            value: traceId
        filterByTraceID:  true
        filterBySpanID:   false
        customQuery:      true
        # LogQL query para buscar logs pelo traceId do span selecionado
        query: '{application="inspectflow"} | json | traceId="${__span.traceId}"'

      tracesToMetrics:
        # Correlação Jaeger → Prometheus
        # Ao ver um trace lento, mostra as métricas relacionadas
        datasourceUid: prometheus
        spanStartTimeShift: "-1m"
        spanEndTimeShift:   "1m"
        tags:
          - key:   service.name
            value: application
        queries:
          - name:  "Latência do serviço"
            query: 'histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application="$__tags.application"}[$__rate_interval])) by (le))'

      nodeGraph:
        enabled: true   # Mapa de dependências entre serviços

  # ============================================================================
  # LOKI — Logs
  # ============================================================================
  - name:    Loki
    type:    loki
    uid:     loki
    access:  proxy
    url:     http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        # Correlação Loki → Jaeger
        # Detecta traceId nos logs e cria link direto para o trace no Jaeger
        - name:             traceId
          matcherRegex:     '"traceId":"([a-f0-9]+)"'
          url:              "$${__value.raw}"
          datasourceUid:    jaeger
          urlDisplayLabel:  "Ver trace no Jaeger"