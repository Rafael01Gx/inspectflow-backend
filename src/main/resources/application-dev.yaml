spring:
  flyway:
    locations: classpath:db/migration/dev
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://127.0.0.1:4318/v1/traces

logging:
  level:
    net.ttddyy.observation: DEBUG
    com.google.protobuf: ERROR
    io.opentelemetry: DEBUG
    io.micrometer.tracing: DEBUG
    io.micrometer.registry.otlp: WARN
    io.opentelemetry.exporter.otlp: DEBUG
    io.opentelemetry.sdk.trace.export: DEBUG
    io.opentelemetry.exporter.internal: DEBUG


app:
  security:
    jwt:
      issuer: http://localhost:4200
      cookie-http-only: false
      cookie-same-site: None

  bucket:
    minio:
      bucketName: inspectflow
      endpoint: http://localhost:9000
      access-key: admin
      secret-key: admin123
      public-url: http://localhost:9000

  host:
    api: "http://localhost:8080"
    web: "http://localhost:4200"

springdoc:
  api-docs:
    enabled: true

scalar:
  enabled: true

