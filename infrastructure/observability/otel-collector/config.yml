receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout:         5s
    send_batch_size: 1024

  resource:
    attributes:
      - key:    service.name
        value:  inspectflow
        action: insert           # insert = só adiciona se não existir

      - key:    deployment.environment
        value:  production
        action: insert

      - key:    application
        value:  inspectflow
        action: insert

      - key:    environment
        value:  production
        action: insert

exporters:

  # -------------------------------------------------------------------------
  # Jaeger — via OTLP gRPC (protocolo correto para versões modernas)
  # -------------------------------------------------------------------------
  otlp_grpc/jaeger:
    endpoint: inspectflow-jaeger:4317
    tls:
      insecure: true

  otlp_http/loki:
    endpoint: http://inspectflow-loki:3100/otlp
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers:  [ otlp ]
      processors: [ resource, batch ]
      exporters:  [ otlp_grpc/jaeger ]   # debug removido em produção

    logs:
      receivers:  [ otlp ]
      processors: [ resource, batch ]
      exporters:  [ otlp_http/loki ]

  telemetry:
    logs:
      level: warn
