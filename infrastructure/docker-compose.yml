services:

  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    user: "0:1001"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=DEBUG"
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=inspectflow-network"
      - "--providers.docker.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--ping=true"
      - "--ping.entrypoint=web"
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - traefik-certificates:/letsencrypt
    networks:
      - inspectflow-network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.rflgx.com.br`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=web"

  inspectflow-web:
    image: xrafaelgx/inspectflow-web:latest
    container_name: inspectflow-web
    restart: unless-stopped
    environment:
      - API_URL=/api
      - API_IA_URL=/api/ia
      - WS_URL=/api/ws
      - PORT=4000
    networks:
      - inspectflow-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`inspectflow.rflgx.com.br`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=4000"
      - "traefik.http.middlewares.frontend-compress.compress=true"
      - "traefik.http.routers.frontend.middlewares=frontend-compress"

  inspectflow-api:
    image: xrafaelgx/inspectflow-api:latest
    container_name: inspectflow-api
    restart: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inspectflow-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`inspectflow.rflgx.com.br`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.api-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.api.middlewares=api-stripprefix"
      - "traefik.http.services.api.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.api.loadbalancer.sticky.cookie.name=api_sticky"

  postgres:
    image: postgres:18-alpine
    container_name: inspectflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inspectflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - inspectflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8
    container_name: inspectflow-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_pass
      MONGO_INITDB_DATABASE: inspectflow
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - inspectflow-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/inspectflow --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.2-alpine3.22
    container_name: inspectflow-redis-1
    restart: unless-stopped
    networks:
      - inspectflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:3.2
    container_name: inspectflow-redis-insight
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    networks:
      - inspectflow-network
    depends_on:
      - redis

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inspectflow-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inspectflow.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - inspectflow-network
    depends_on:
      - postgres

  mongo-express:
    image: mongo-express:latest
    container_name: inspectflow-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin_pass
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin_pass@inspectflow-mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - inspectflow-network
    depends_on:
      - mongodb

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
      MINIO_SERVER_URL: http://minio.rflgx.com.br
    volumes:
      - minio_data:/data
    networks:
      - inspectflow-network
    command: server /data --console-address ":9001"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=inspectflow-network"

      # API S3 (porta 9000)
      - "traefik.http.routers.minio.rule=Host(`minio.rflgx.com.br`)"
      - "traefik.http.routers.minio.entrypoints=web"
      - "traefik.http.routers.minio.priority=100"
      - "traefik.http.routers.minio.service=minio-svc"          # ← associa ao service
      - "traefik.http.services.minio-svc.loadbalancer.server.port=9000"

      # Console (porta 9001)
      - "traefik.http.routers.minio-console.rule=Host(`minio-console.rflgx.com.br`)"
      - "traefik.http.routers.minio-console.entrypoints=web"
      - "traefik.http.routers.minio-console.priority=100"
      - "traefik.http.routers.minio-console.service=minio-console-svc"   # ← associa ao service
      - "traefik.http.services.minio-console-svc.loadbalancer.server.port=9001"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - inspectflow-network
    depends_on:
      - traefik

volumes:
  postgres_data:
    driver: local
    name: inspectflow_postgres_data
  mongodb_data:
    driver: local
    name: inspectflow_mongodb_data
  mongodb_config:
    driver: local
    name: inspectflow_mongodb_config
  pgadmin_data:
    driver: local
    name: inspectflow_pgadmin_data
  minio_data:
    driver: local
    name: inspectflow_minio_data
  traefik-certificates:
    driver: local
    name: inspectflow_traefik_certificates

networks:
  inspectflow-network:
    driver: bridge
    name: inspectflow-network
