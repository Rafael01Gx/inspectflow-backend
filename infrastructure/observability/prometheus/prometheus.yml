global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

  external_labels:
    monitor:     inspectflow-prometheus
    environment: production

scrape_configs:

  # ----------------------------------------------------------------------------
  # InspectFlow — container na mesma rede Docker
  # A aplicação deve expor management.server.port=8090
  # ----------------------------------------------------------------------------
  - job_name: inspectflow
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - inspectflow-api:8090
        labels:
          application: inspectflow
          environment: production

  # ----------------------------------------------------------------------------
  # Prometheus self-monitoring
  # ----------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
