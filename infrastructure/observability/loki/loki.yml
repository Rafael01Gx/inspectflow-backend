auth_enabled: false

server:
  http_listen_port: 3100

  http_server_read_timeout:  120s
  http_server_write_timeout: 120s
  grpc_server_max_recv_msg_size: 104857600  # 100 MB

common:
  path_prefix: /loki

  replication_factor: 1

  ring:
    kvstore:
      store: inmemory

  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory:  /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store:        tsdb
      object_store: filesystem
      schema:       v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

  # Produção: aumenta o cache de índice para reduzir I/O
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location:         /loki/tsdb-cache
    cache_ttl:              24h

ingester:
  wal:
    enabled: true
    dir:     /loki/wal

    flush_on_shutdown: true

  # Produção: chunk maior = melhor compressão e menos objetos no storage
  chunk_target_size:  1572864   # 1.5 MB
  chunk_idle_period:  30m
  max_chunk_age:      2h

limits_config:
  # Habilitado para suportar metadados estruturados do OTel
  allow_structured_metadata: true

  retention_period: 720h

  # Proteção contra ingestão excessiva
  ingestion_rate_mb:       16
  ingestion_burst_size_mb: 32
  max_streams_per_user:    10000
  max_line_size:           262144    # 256 KB

compactor:
  working_directory:       /loki/compactor
  compaction_interval:     10m
  retention_enabled:       true
  retention_delete_delay:  2h
  delete_request_store:    filesystem
