################################################################################
# PROMTAIL — Agente de coleta de logs para o Loki
# InspectFlow Observabilidade
################################################################################
#
# Promtail lê os arquivos de log JSON gerados pelo logback-spring.xml
# e os envia para o Loki com labels para indexação.
#
# PIPELINE:
#   logback-spring.xml → logs/inspectflow.log (JSON)
#         ↓
#      Promtail (este arquivo)
#         ↓
#      Loki (armazenamento)
#         ↓
#      Grafana (visualização + correlação com Jaeger)
#
# LABELS INDEXADAS (baixa cardinalidade — para filtros rápidos no Grafana):
#   job         → "inspectflow"
#   application → "inspectflow"
#   environment → "dev" | "prod"
#   level       → "INFO" | "WARN" | "ERROR"
#
# CAMPOS DISPONÍVEIS VIA LogQL (alta cardinalidade — busca por conteúdo):
#   traceId, spanId, correlationId, userId, httpMethod, requestUri, etc.
#
################################################################################

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # Arquivo de controle — onde o Promtail parou de ler
  # Garante que logs não sejam perdidos em reinicializações
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ============================================================================
  # Job: InspectFlow Application Logs
  # ============================================================================
  - job_name: inspectflow

    static_configs:
      - targets:
          - localhost
        labels:
          job: inspectflow
          application: inspectflow
          environment: ${ENVIRONMENT:-dev}
          # __path__ define qual arquivo será lido
          __path__: /logs/inspectflow*.log

    pipeline_stages:

      # -------------------------------------------------------------------------
      # Stage 1: Parse JSON
      # Extrai campos do JSON gerado pelo LogstashEncoder
      # -------------------------------------------------------------------------
      - json:
          expressions:
            level:         level
            logger:        logger
            message:       message
            traceId:       traceId
            spanId:        spanId
            correlationId: correlationId
            userId:        userId
            httpMethod:    httpMethod
            requestUri:    requestUri
            clientIp:      clientIp
            thread:        thread
            timestamp:     "@timestamp"

      # -------------------------------------------------------------------------
      # Stage 2: Labels de baixa cardinalidade
      # Apenas campos com poucos valores distintos viram labels do Loki
      # (alta cardinalidade como traceId/userId NÃO devem ser labels)
      # -------------------------------------------------------------------------
      - labels:
          level:       # INFO, WARN, ERROR, DEBUG — baixa cardinalidade ✅
          # application e environment já são labels do static_configs

      # -------------------------------------------------------------------------
      # Stage 3: Timestamp
      # Usa o @timestamp do JSON (não o timestamp de ingestão do Promtail)
      # Garante ordem correta dos logs mesmo com pequenos atrasos
      # -------------------------------------------------------------------------
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - "2006-01-02T15:04:05.999Z07:00"
            - "2006-01-02T15:04:05Z"

      # -------------------------------------------------------------------------
      # Stage 4: Output
      # Define qual campo é a mensagem principal do log no Loki
      # -------------------------------------------------------------------------
      - output:
          source: message

      # -------------------------------------------------------------------------
      # Stage 5: Drop — ignora logs de health check do Kubernetes/Prometheus
      # Reduz volume de logs irrelevantes no Loki
      # -------------------------------------------------------------------------
      - drop:
          expression: '.*actuator/health.*'
          drop_counter_reason: health_check_noise